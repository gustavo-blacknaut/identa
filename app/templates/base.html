<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Green OCR{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Green OCR</a>
    {% block nav %}
    <nav>
      <a href="/">Painel</a>
      <a class="button" href="/novo">Novo documento</a>
      <form method="post" action="/logout"><button class="link" type="submit">Sair</button></form>
    </nav>
    {% endblock %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
