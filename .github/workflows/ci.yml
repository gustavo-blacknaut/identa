name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  NODE_VERSION: "24.21.0"

jobs:
  api:
    name: API (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: identa_test
          POSTGRES_USER: identa
          POSTGRES_PASSWORD: identa-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U identa -d identa_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    env:
      IDENTA_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://identa:identa-test@127.0.0.1:5432/identa_test' || '' }}
      IDENTA_OCR_MODEL_DIR: ${{ github.workspace }}/apps/api/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
      - run: uv sync --frozen --extra cpu --extra tesseract --extra dev
      - run: uv run ruff check .
      - run: uv run python -m identa.cli download-models
      - run: uv run pytest
      - name: OpenAPI em dia
        run: |
          uv run python -m identa.cli export-openapi --output openapi.json
          git diff --exit-code openapi.json

  api-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv export --frozen --extra cpu --extra tesseract --no-hashes --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit --strict -r requirements-audit.txt

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || true
      - name: Tipos da API em dia
        run: |
          npm run api:types
          git diff --exit-code src/lib/api/schema.d.ts

  e2e:
    runs-on: ubuntu-24.04
    needs: [api, web]
    env:
      IDENTA_OCR_MODEL_DIR: ${{ github.workspace }}/apps/api/models
      IDENTA_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen --extra cpu
        working-directory: apps/api
      - run: uv run python -m identa.cli download-models
        working-directory: apps/api
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=setup --project=flows --project=responsive
        working-directory: apps/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: apps/api
          target: runtime
          push: false
          tags: identa-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: apps/web
          push: false
          tags: identa-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
